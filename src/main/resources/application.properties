server.port=8080
management.endpoints.web.exposure.include=*

app.name=NauJava
app.version=1.0

spring.datasource.url=${DB_URL}?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

spring.main.allow-bean-definition-overriding=true
javamelody.enabled=true
javamelody.management-endpoints.web.base-path=/monitoring

javamelody.init-parameters.authorized-users=admin:admin
javamelody.init-parameters.storage-directory=/tmp/javamelody
javamelody.init-parameters.monitored-packages=ru.glebova.NauJava.adapter.controller, ru.glebova.NauJava.service
javamelody.init-parameters.resolution-seconds=60
javamelody.init-parameters.log=true
javamelody.init-parameters.system-actions-enabled=true
javamelody.init-parameters.http-transform-pattern=.*
javamelody.init-parameters.url-exclude-pattern=/static/.*,/favicon.ico
javamelody.init-parameters.sampling-period-seconds=60
javamelody.init-parameters.sampling-regex=.*