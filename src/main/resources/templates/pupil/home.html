<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Портал ученика | Школьный дневник</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3f51b5;
            --secondary-color: #f8f9fa;
            --hover-color: #303f9f;
        }

        body {
            background-color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .teacher-container {
            max-width: 800px; /* Уже контейнер для двух пунктов */
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
        }

        .logo {
            width: 70px;
            height: 70px;
        }

        .btn-logout {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            background-color: var(--primary-color);
            border: none;
            color: white;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background-color: var(--hover-color);
            transform: translateY(-2px);
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .username {
            color: var(--primary-color);
            font-weight: 600;
        }

        .teacher-title {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-weight: 600;
            text-align: center;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .menu-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0;
            text-align: center;
            cursor: pointer;
            height: 100%;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-color: var(--primary-color);
        }

        .menu-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .menu-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #333;
        }

        .menu-description {
            color: #666;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        .btn-teacher {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .btn-teacher:hover {
            background-color: var(--hover-color);
            color: white;
            transform: translateY(-2px);
        }

        .role-badge {
            background-color: var(--primary-color);
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<div class="teacher-container">
    <div class="header">
        <img src="https://cdn-icons-png.flaticon.com/512/3565/3565418.png" alt="Логотип" class="logo">
        <form th:action="@{/logout}" method="get">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-logout">
                <i class="fas fa-sign-out-alt"></i> Выйти
            </button>
        </form>
    </div>

    <div class="welcome-section">
        <span class="role-badge">Ученик</span>
        <h2>Добро пожаловать, <span class="username" th:text="${user.firstName} + ' ' + ${user.lastName}">Ученик</span>!</h2>
        <p class="mt-3">Панель управления кабинетом</p>
    </div>

    <h3 class="teacher-title">Основные функции</h3>

    <div class="menu-grid">
        <!-- Расписание -->
        <a th:href="@{/pupil/schedule}" class="menu-card text-decoration-none">
            <div class="menu-icon">
                <i class="fas fa-calendar-alt"></i>
            </div>
            <h4 class="menu-title">Моё расписание</h4>
            <p class="menu-description">Просмотр вашего расписания уроков</p>
            <button class="btn btn-teacher">Открыть расписание</button>
        </a>

        <!-- Журнал оценок -->
        <a th:href="@{/pupil/grades/setup}" class="menu-card text-decoration-none">
            <div class="menu-icon">
                <i class="fas fa-book"></i>
            </div>
            <h4 class="menu-title">Электронный журнал</h4>
            <p class="menu-description">Просмотр оценок</p>
            <button class="btn btn-teacher">Открыть журнал</button>
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
